<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Familjen Losell</title>
  <meta name="description" content="Familjen Losell från Kållered." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏡</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Source+Code+Pro:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    /* Färger från Sweat Builders logga: plommon → turkos, vita bokstäver. */
    :root {
      --background: #fbf8f9;
      --surface: #ffffff;
      --color: #2a0a14;
      --muted: #6b4a55;
      --accent: #7b1b38;
      --accent-2: #07959e;
      --gradient: linear-gradient(90deg, #7b1b38, #09cdda);
      --line: rgba(123, 27, 56, 0.15);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --background: #1c0a12;
        --surface: #2a1019;
        --color: #f6eef1;
        --muted: #b99aa5;
        --accent: #dd6589;
        --accent-2: #09cdda;
        --gradient: linear-gradient(90deg, #dd6589, #09cdda);
        --line: rgba(246, 238, 241, 0.15);
      }
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body { margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      background: var(--background);
      color: var(--color);
      font-family: "Source Code Pro", ui-monospace, monospace;
      font-size: 1rem;
      line-height: 1.6;
    }
    body::before {
      content: "";
      flex: none;
      height: 6px;
      background: var(--gradient);
    }

    main {
      flex: 1;
      width: 100%;
      max-width: 44rem;
      margin: 0 auto;
      padding: clamp(4rem, 14vh, 9rem) 1rem 3rem;
    }

    .eyebrow {
      margin: 0 0 1rem;
      font-size: 0.85rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
    }

    h1 {
      margin: 0;
      font-family: "Fraunces", Georgia, serif;
      font-weight: 600;
      font-size: clamp(3.5rem, 15vw, 7.5rem);
      line-height: 0.95;
      letter-spacing: -0.02em;
    }
    h1 .dot { color: var(--accent-2); }

    .lead {
      margin: 1.75rem 0 0;
      max-width: 32rem;
      font-size: 1.05rem;
      color: var(--muted);
    }

    h2 {
      margin: 4rem 0 1rem;
      font-size: 0.85rem;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .members {
      list-style: none;
      margin: 0;
      padding: 0;
      border-top: 1px solid var(--line);
    }
    .members li { border-bottom: 1px solid var(--line); }
    .members a {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1rem 0.25rem;
      color: inherit;
      text-decoration: none;
      transition: padding 0.2s ease;
    }
    .members a:hover,
    .members a:focus-visible { padding-left: 0.75rem; }
    .members a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .initial {
      flex: none;
      display: grid;
      place-items: center;
      width: 2.75rem;
      height: 2.75rem;
      border-radius: 50%;
      background: var(--surface);
      border: 1px solid var(--line);
      font-family: "Fraunces", Georgia, serif;
      font-weight: 600;
      font-size: 1.25rem;
      color: var(--accent);
    }
    .name {
      font-family: "Fraunces", Georgia, serif;
      font-size: 1.4rem;
    }
    .url {
      margin-left: auto;
      font-size: 0.85rem;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .arrow { color: var(--accent-2); transition: transform 0.2s ease; }
    .members a:hover .arrow { transform: translateX(4px); }

    .wedding {
      display: block;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--surface);
      color: inherit;
      text-decoration: none;
      transition: border-color 0.2s ease, transform 0.2s ease;
    }
    .wedding:hover,
    .wedding:focus-visible { border-color: var(--accent); transform: translateY(-2px); }
    .wedding:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .wedding-photos {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr;
      grid-template-rows: clamp(9rem, 32vw, 13rem);
      gap: 3px;
    }
    .wedding-photos img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: var(--line);
    }

    .wedding-body {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1.1rem 1.25rem 1.25rem;
    }
    .wedding-title {
      margin: 0;
      font-family: "Fraunces", Georgia, serif;
      font-size: 1.6rem;
      line-height: 1.2;
    }
    .wedding-title .amp { color: var(--accent); font-style: italic; }
    .wedding-meta {
      margin: 0.25rem 0 0;
      font-size: 0.85rem;
      color: var(--muted);
    }
    .wedding .arrow { margin-left: auto; font-size: 1.25rem; }
    .wedding:hover .arrow { transform: translateX(4px); }

    footer {
      width: 100%;
      max-width: 44rem;
      margin: 0 auto;
      padding: 2rem 1rem;
      font-size: 0.8rem;
      color: var(--muted);
    }

    @media (max-width: 420px) {
      .url { display: none; }
      .arrow { margin-left: auto; }
      .wedding-photos { grid-template-columns: 2fr 1fr; }
      .wedding-photos img:last-child { display: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      .members a, .arrow, .wedding { transition: none; }
      .wedding:hover, .wedding:focus-visible { transform: none; }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Kållered</p>
    <h1>Losell<span class="dot">.</span></h1>
    <p class="lead">Hej! Det här är familjen Losells lilla hörna av internet.</p>

    <h2>Hitta oss</h2>
    <!-- Lägg till en <li> per familjemedlem som har en egen sida. -->
    <ul class="members">
      <li>
        <a href="https://mikael.losell.nu">
          <span class="initial" aria-hidden="true">M</span>
          <span class="name">Mikael</span>
          <span class="url">mikael.losell.nu</span>
          <span class="arrow" aria-hidden="true">→</span>
        </a>
      </li>
    </ul>

    <h2>Bröllop</h2>
    <a class="wedding" href="https://bröllop.losell.nu">
      <div class="wedding-photos">
        <img src="https://bröllop.losell.nu/thumbs/annalindstromfoto220709_019.jpg" alt="Mikael och Fredrika går hand i hand under rosenbågarna" loading="lazy" />
        <img src="https://bröllop.losell.nu/thumbs/annalindstromfoto220709_027.jpg" alt="" loading="lazy" />
        <img src="https://bröllop.losell.nu/thumbs/annalindstromfoto220709_026.jpg" alt="" loading="lazy" />
      </div>
      <div class="wedding-body">
        <div>
          <p class="wedding-title">Mikael <span class="amp">&amp;</span> Fredrika</p>
          <p class="wedding-meta">9 juli 2022 · Wij Trädgårdar, Ockelbo</p>
          <p class="wedding-meta">bröllop.losell.nu</p>
        </div>
        <span class="arrow" aria-hidden="true">→</span>
      </div>
    </a>
  </main>

  <footer>© <span id="year">2026</span> Familjen Losell</footer>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
